name: Update dashboard

on:
  schedule:
    # Odd minutes on purpose: GitHub delays or drops scheduled runs at busy times (:00, :30).
    # Each slot has a backup; a backup run just refreshes the data (same prices, new timestamp).
    - cron: "47 21 * * 0-5"   # 04:47 Bangkok, Mon–Sat: after US close, before Asia opens (07:00)
    - cron: "13 23 * * 0-5"   # 06:13 Bangkok, Mon–Sat: backup, still before Asia opens
    - cron: "13 11 * * 1-5"   # 18:13 Bangkok, Mon–Fri: after Asia close
    - cron: "7 12 * * 1-5"    # 19:07 Bangkok, Mon–Fri: backup
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and build JSON
        # tvdatafeed converts bar timestamps with local time; Bangkok time gives the correct trading date
        # for every series (FX/gold sessions open the previous evening in UTC).
        env:
          TZ: Asia/Bangkok
        run: python scripts/build_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update market data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
